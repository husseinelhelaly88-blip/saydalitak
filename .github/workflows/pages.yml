name: Deploy SAYDALITAK to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild exact production site
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, pathlib
          root = pathlib.Path(".")
          b64 = b"".join((root/"fix"/f"full_prod_{i}.b64").read_bytes().strip() for i in range(1,5))
          compressed = base64.b64decode(b64, validate=True)
          html = gzip.decompress(compressed)
          digest = hashlib.sha256(html).hexdigest()
          expected = "d51e95b982222e547505ba6dd2f89fd2b6881db51e48ba7cde913bd902346814"
          print("bytes:", len(html))
          print("sha256:", digest)
          if digest != expected:
              raise SystemExit(f"Checksum mismatch: {digest}")
          (root/"index.html").write_bytes(html)
          (root/".nojekyll").touch()
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
