name: Validate SAYDALITAK production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production pieces
        shell: bash
        run: |
          echo "== plain parts =="
          sha256sum parts/part01.txt parts/part02.txt parts/part03.txt parts/part04.txt parts/part05.txt parts/tail01.txt parts/tail02.txt
          echo "== compressed tails (decompressed hashes) =="
          for f in parts/tail03.txt.gz parts/tail04.txt.gz parts/tail05.txt.gz parts/tail06.txt.gz parts/tail07.txt.gz parts/tail08.txt.gz parts/tail09.txt.gz; do
            printf "%s  " "$f"
            gzip -dc "$f" | sha256sum
          done
          cat parts/part01.txt parts/part02.txt parts/part03.txt parts/part04.txt parts/part05.txt parts/tail01.txt parts/tail02.txt > index.html
          for f in parts/tail03.txt.gz parts/tail04.txt.gz parts/tail05.txt.gz parts/tail06.txt.gz parts/tail07.txt.gz parts/tail08.txt.gz parts/tail09.txt.gz; do
            gzip -dc "$f" >> index.html
          done
          echo "== assembled =="
          wc -c index.html
          sha256sum index.html
