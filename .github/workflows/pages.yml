name: Deploy SAYDALITAK to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild exact production site
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, pathlib

          root = pathlib.Path(".")
          out = bytearray()

          for name in ["part01.txt","part02.txt"]:
              out += (root/"parts"/name).read_bytes()

          b64 = b"".join((root/"fix"/name).read_bytes().strip()
                         for name in ["part03_1.b64","part03_2.b64","part03_3.b64","part03_4.b64"])
          out += gzip.decompress(base64.b64decode(b64, validate=True))

          for name in ["part04.txt","part05.txt","tail01.txt"]:
              out += (root/"parts"/name).read_bytes()

          tail02 = base64.b64decode((root/"fix"/"tail02.b64").read_bytes().strip(), validate=True)
          out += gzip.decompress(tail02)

          for name in ["tail03.txt.gz","tail04.txt.gz","tail05.txt.gz","tail06.txt.gz","tail07.txt.gz","tail08.txt.gz","tail09.txt.gz"]:
              out += gzip.decompress((root/"parts"/name).read_bytes())

          digest = hashlib.sha256(out).hexdigest()
          expected = "d51e95b982222e547505ba6dd2f89fd2b6881db51e48ba7cde913bd902346814"
          print("assembled bytes:", len(out))
          print("sha256:", digest)
          if digest != expected:
              raise SystemExit(f"Checksum mismatch: {digest}")

          (root/"index.html").write_bytes(out)
          (root/".nojekyll").touch()
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
