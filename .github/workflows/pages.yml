name: Deploy SAYDALITAK to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild production site
        shell: bash
        run: |
          cat parts/part01.txt parts/part02.txt parts/part03.txt parts/part04.txt parts/part05.txt parts/tail01.txt parts/tail02.txt > index.html
          for f in parts/tail03.txt.gz parts/tail04.txt.gz parts/tail05.txt.gz parts/tail06.txt.gz parts/tail07.txt.gz parts/tail08.txt.gz parts/tail09.txt.gz; do
            gzip -dc "$f" >> index.html
          done
          echo "d51e95b982222e547505ba6dd2f89fd2b6881db51e48ba7cde913bd902346814  index.html" | sha256sum -c -
          touch .nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
